name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
          body: |
            ## GitHub Tree View ${{ steps.get_version.outputs.version }}

            ### Installation
            1. Download `main.js`, `manifest.json`, and `styles.css`
            2. Create a folder in your vault: `.obsidian/plugins/obsidian-github-tree/`
            3. Place all three files in that folder
            4. Enable the plugin in Obsidian Settings → Community Plugins

            Or install directly via the Obsidian Community Plugin browser.
